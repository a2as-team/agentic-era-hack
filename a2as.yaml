    agents: [root_agent.5, root_agent.12]
  gemini-2.5-flash:
    type: literal
    agents: [root_agent.0, root_agent.1, root_agent.2, root_agent.3, root_agent.4, root_agent.6, root_agent.7, root_agent.8,
      root_agent.9, root_agent.10, root_agent.11, root_agent.13, root_agent.14, root_agent.15]

tools:
  answer_question_about_articles:
    type: function
    agents: [root_agent.2, root_agent.11]
    params:
      description: |-
        Answer specific questions about the articles content.

        Args:
            question: The user's question about the articles
  check_answer_and_continue:
    type: function
    agents: [root_agent.0, root_agent.10]
    params:
      description: |-
        Check the user's answer and provide the next question or quiz completion.

        Args:
            user_answer: The user's answer (A, B, C, or D)
            current_question: The current question being answered (optional for context)
  generate_video:
    type: function
    agents: [root_agent.5, root_agent.12]
    params:
      description: "Generates a video based on a user's prompt and creates an HTML page \nto display it with embedded video\
        \ data."
  get_articles_summary:
    type: function
    agents: [root_agent.2, root_agent.11]
    params:
      description: |-
        Get a summary of all articles, optionally filtered by a query.

        Args:
            query: Optional query to focus the summary on specific topics
  get_current_time:
    type: function
    agents: [root_agent.8]
    params:
      description: |-
        Simulates getting the current time for a city.

        Args:
            city: The name of the city to get the current time for.

        Returns:
            A string with the current time information.
  get_weather:
    type: function
    agents: [root_agent.8]
    params:
      description: |-
        Simulates a web search. Use it get information on weather.

        Args:
            query: A string containing the location to get weather information for.

        Returns:
            A string with the simulated weather information for the queried location.
  google_search:
    type: module
    agents: [root_agent.3, root_agent.7, root_agent.14, root_agent.15]
  list_audio:
    type: function
    agents: [root_agent.1, root_agent.9]
    params:
      description: List MP3 files in current directory.
  speak_text:
    type: function
    agents: [root_agent.1, root_agent.9]
    params:
      description: Convert text to speech and play it.
  start_quiz:
    type: function
    agents: [root_agent.0, root_agent.10]
    params:
      description: |-
        Start an interactive quiz session based on the articles content.

        Args:
            topic: Optional specific topic to focus quiz questions on
            difficulty: Quiz difficulty level (easy, medium, hard)

teams:
  root_agent.13:
    type: hierarchy
    agents: [root_agent.13, onboarding_agent, articles_search_agent, articles_chat_agent, text_to_speech_agent, article_quiz_agent,
      text_to_video_agent, events_search_agent]

imports:
  AdkApp: vertexai.preview.reasoning_engines.AdkApp
  Agent: google.adk.agents.Agent
  agent_engines: vertexai.agent_engines
  Any: typing.Any
  argparse: argparse
  article_quiz_agent: subagents.article_quiz_agent
  articles_chat_agent: subagents.articles_chat_agent
  articles_search_agent: subagents.articles_search_agent
  auth: google.auth
  base64: base64
  CloudTraceLoggingSpanExporter: app.utils.tracing.CloudTraceLoggingSpanExporter
  copy: copy
  create_bucket_if_not_exists: app.utils.gcs.create_bucket_if_not_exists
  datetime: datetime
  events_search_agent: subagents.events_search_agent
  export: opentelemetry.sdk.trace.export
  Feedback: app.utils.typing.Feedback
  GcsArtifactService: google.adk.artifacts.GcsArtifactService
  genai: google.genai
  GenerateVideosConfig: google.genai.types.GenerateVideosConfig
  google_cloud_logging: google.cloud.logging
  google_search: google.adk.tools.google_search
  json: json
  List: typing.List
  logging: logging
  onboarding_agent: subagents.onboarding_agent
  Optional: typing.Optional
  os: os
  Path: pathlib.Path
  root_agent: app.agent.root_agent
  storage: google.cloud.storage
  sys: sys
  tempfile: tempfile
  text_to_speech_agent: subagents.text_to_speech_agent
  text_to_video_agent: subagents.text_to_video_agent
  texttospeech: google.cloud.texttospeech
  time: time
  timedelta: datetime.timedelta
  trace: opentelemetry.trace
  TracerProvider: opentelemetry.sdk.trace.TracerProvider
  unittest: unittest
  uuid: uuid
  vertexai: vertexai
  webbrowser: webbrowser
  ZoneInfo: zoneinfo.ZoneInfo

functions:
  answer_question_about_articles:
    type: sync
    module: agents.skillscape_orchestration.subagents.articles_chat.agent
    args: [question]
    params:
      returns: str
  check_answer_and_continue:
    type: sync
    module: agents.article_quiz.agent
    args: [user_answer, current_question]
    params:
      returns: str
  clone:
    type: sync
    module: app.agent_engine_app
    args: [self]
    params:
      returns: AgentEngineApp
  create_html_for_video:
    type: sync
    module: agents.text_to_video.agent
    args: [video_data, prompt, agent_dir]
    params:
      returns: str
  deploy_agent_engine_app:
    type: sync
    module: app.agent_engine_app
    args: [project, location, agent_name, requirements_file, extra_packages, env_vars, service_account]
    params:
      returns: agent_engines.AgentEngine
  generate_video:
    type: sync
    module: agents.text_to_video.agent
    args: [prompt]
    params:
      returns: str
  get_articles_summary:
    type: sync
    module: agents.skillscape_orchestration.subagents.articles_chat.agent
    args: [query]
    params:
      returns: str
  get_current_time:
    type: sync
    module: app.agent
    args: [query]
    params:
      returns: str
  get_weather:
    type: sync
    module: app.agent
    args: [query]
    params:
      returns: str
  list_audio:
    type: sync
    module: agents.skillscape_orchestration.subagents.text_to_speech.agent
    params:
      returns: str
  read_articles:
    type: sync
    module: agents.skillscape_orchestration.subagents.articles_chat.agent
    params:
      returns: List[str]
  register_feedback:
    type: sync
    module: app.agent_engine_app
    args: [self, feedback]
    params:
      returns: None
  register_operations:
    type: sync
    module: app.agent_engine_app
    args: [self]
    params:
      returns: dict
  set_up:
    type: sync
    module: app.agent_engine_app
    args: [self]
    params:
      returns: None
  speak_text:
    type: sync
    module: agents.skillscape_orchestration.subagents.text_to_speech.agent
    args: [text]
    params:
      returns: str
  start_quiz:
    type: sync
    module: agents.article_quiz.agent
    args: [topic, difficulty]
    params:
      returns: str
  test_html_creation:
    type: sync
    module: agents.text_to_video.agent
    args: [self]

variables:
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.environ]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.environ.get]
      path: [app.agent_engine_app]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.environ]

files:
  articles/:
    type: literal
    actions: [read]
    params:
      caller: [read_articles]
  articles_path:
    type: variable
    actions: [read]
    params:
      caller: [articles_path.glob]
  deployment_metadata.json:
    type: literal
    actions: [write]
    params:
      caller: [open]
      alias: [f]
      variable: config_file
  html_filepath:
    type: variable
    actions: [write, read, delete]
    params:
      caller: [open, os.path.abspath, os.path.exists, os.remove]
      alias: [f]
  output_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  requirements_file:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
